<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 0 1.5rem;
        line-height: 1.6;
        color: #222;
        background: #fafafa;
      }
      h1 {
        font-size: 6rem;
        margin: 0;
        letter-spacing: -2px;
      }
      h2 {
        font-size: 1.5rem;
        margin: 0.25rem 0;
      }
      p {
        color: #666;
        margin: 0.5rem 0 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1.2rem;
        background: #222;
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
      }
      a:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
